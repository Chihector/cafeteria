# Café Rosé - Nginx (app + Reverb)
#
# Reemplaza cafeteria.example.com y ws.cafeteria.example.com por tus dominios.
# Ajusta la versión de PHP-FPM (php8.3-fpm.sock) si usas otra.
# Certificados: sudo certbot --nginx -d cafeteria.example.com -d ws.cafeteria.example.com

server {
    listen 80;
    listen [::]:80;
    server_name cafeteria.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cafeteria.example.com;

    root /var/www/cafeteria/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/cafeteria.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cafeteria.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/cafeteria-access.log;
    error_log  /var/log/nginx/cafeteria-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~* \.(?:jpg|jpeg|png|gif|ico|svg|webp|css|js|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# WebSocket de Reverb. El cliente se conecta a wss://ws.cafeteria.example.com
server {
    listen 80;
    listen [::]:80;
    server_name ws.cafeteria.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ws.cafeteria.example.com;

    ssl_certificate     /etc/letsencrypt/live/ws.cafeteria.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.cafeteria.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        proxy_pass http://127.0.0.1:8080;
    }
}
